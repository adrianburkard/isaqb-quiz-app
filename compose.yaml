services:
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev server with hot reload: docker compose --profile dev up dev
  dev:
    image: node:22-alpine
    profiles: [dev]
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
